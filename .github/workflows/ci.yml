name: Albugent Governance & Quality CI

# 1. Запуск по расписанию (Cron) и вручную по кнопке из GitHub
on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 06:00 UTC
  workflow_dispatch:     # Кнопка "Run workflow" в интерфейсе GitHub

# Добавляем права на запись в репозиторий и создание Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-build:
    name: Run Autonomous Data Governance Agent
    runs-on: ubuntu-latest

    steps:
      # Step 1: Клонируем репозиторий
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Скачиваем файлы из конкретного релиза v1.0.0
      - name: Download Datasets from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/fiction-retail data/healthcare data/nyc-taxi

          curl -L -H "Authorization: token $GH_TOKEN" -o data/fiction-retail/fiction-retail.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/fiction-retail.db"
          curl -L -H "Authorization: token $GH_TOKEN" -o data/healthcare/healthcare.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/healthcare.db"
          curl -L -H "Authorization: token $GH_TOKEN" -o data/nyc-taxi/nyc_taxi_pipeline.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/nyc_taxi_pipeline.db"

      # Проверка: убеждаемся, что скачался SQLite файл, а не HTML
      - name: Verify Databases
        run: file data/*/*.db

      # Step 3: Сбрасываем права, чтобы Docker 100% увидел эти файлы
      - name: Fix permissions for Docker
        run: chmod -R 777 data

      # Step 4: Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Собираем Docker-контейнеры (теперь они увидят скачанные файлы)
      - name: Build Docker Services
        run: docker compose build --no-cache

      # Step 6: Запуск Агента
      - name: Execute Albugent Autonomous Workflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose run --rm strands-agent python agent/agent.py