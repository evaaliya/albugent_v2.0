name: Albugent Governance & Quality CI

# 1. Запуск по расписанию (Cron) и вручную по кнопке из GitHub
on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 06:00 UTC
  workflow_dispatch:     # Кнопка "Run workflow" в интерфейсе GitHub

# Добавляем права на запись в репозиторий и создание Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-build:
    name: Run Autonomous Data Governance Agent
    runs-on: ubuntu-latest

    steps:
      # Step 1: Клонируем репозиторий
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Скачиваем базы данных через официальный GitHub CLI
      - name: Download Datasets from Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/fiction-retail
          mkdir -p data/healthcare
          mkdir -p data/nyc-taxi
          
          # Скачиваем файлы встроенной утилитой gh напрямую в нужные папки
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "fiction-retail.db" --dir data/fiction-retail
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "healthcare.db" --dir data/healthcare
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "nyc_taxi.db" --dir data/nyc-taxi



      # Step 3: Сбрасываем права, чтобы Docker 100% увидел эти файлы
      - name: Fix permissions for Docker
        run: chmod -R 777 data

      # Step 4: Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Собираем Docker-контейнеры (теперь они увидят скачанные файлы)
      - name: Build Docker Services
        run: docker compose build --no-cache

      # Step 6: Запуск Агента
      - name: Execute Albugent Autonomous Workflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose run --rm strands-agent python agent/agent.py
