name: Albugent Governance & Quality CI

# 1. Запуск по расписанию (Cron) и вручную по кнопке из GitHub
on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 06:00 UTC
  workflow_dispatch:     # Кнопка "Run workflow" в интерфейсе GitHub

  # Добавляем права на запись в репозиторий и создание Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-build:
    name: Run Autonomous Data Governance Agent
    runs-on: ubuntu-latest

    steps:
      # Step 1: Клонируем репозиторий
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Собираем Docker-контейнеры
      - name: Build Docker Services
        run: docker compose build

      # Step 4: Запуск полного цикла (Download/Seed DBs + Agent Execution)
      - name: Execute Albugent Autonomous Workflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose run --rm strands-agent bash -c "mkdir -p data/fiction-retail && curl -L 'https://raw.githubusercontent.com/datahub-project/static-assets/main/datasets/fiction-retail/fiction-retail.db' -o data/fiction-retail/fiction-retail.db && python data/healthcare/create_db.py && python data/nyc-taxi/create_db.py && python agent/agent.py"