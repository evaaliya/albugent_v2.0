name: Albugent Governance & Quality CI

# 1. Запуск по расписанию (Cron) и вручную по кнопке из GitHub
on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 06:00 UTC
  workflow_dispatch:     # Кнопка "Run workflow" в интерфейсе GitHub

# Добавляем права на запись в репозиторий и создание Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-build:
    name: Run Autonomous Data Governance Agent
    runs-on: ubuntu-latest

    steps:
      # Step 1: Клонируем репозиторий
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Скачиваем базы данных из GitHub Releases
      - name: Download Datasets from Releases
        run: |
          mkdir -p data
          curl -L -o data/fiction-retail.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/fiction-retail.db"
          curl -L -o data/healthcare.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/healthcare.db"
          curl -L -o data/nyc_taxi.db "https://github.com/evaaliya/albugent_v2.0/releases/download/v1.0.0/nyc_taxi.db"

      # Step 3: Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Собираем Docker-контейнеры
      - name: Build Docker Services
        run: docker compose build

      # Step 5: Запуск Агента на готовых базах из репозитория
      - name: Execute Albugent Autonomous Workflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker compose run --rm strands-agent python agent/agent.py
