version: '3.8'

services:
  strands-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: albugent/agent:1.0
    container_name: albugent-strands-agent
    volumes:
      - ./mcp_server:/app/mcp_server
    stdin_open: true # Интерактивный ввод
    tty: true        # Включает псевдотерминал для Rich UI
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}