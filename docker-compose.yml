services:
  strands-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: albugent/agent:1.0
    container_name: albugent-strands-agent
    volumes:
      # Смонтировать ВЕСЬ корень проекта в контейнер:
      - .:/app
    stdin_open: true # Интерактивный ввод
    tty: true        # Включает псевдотерминал для Rich UI
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}